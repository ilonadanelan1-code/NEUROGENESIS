name: Deploy NEUROGENESIS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check activation.js
          node --check app.js
          node --check knowledge.js
          node --check goals.js
          node --check observation-engine.js
          node --check memory.js
          node tests/activation.test.js
          node tests/knowledge.test.js
          node tests/memory-migration.test.js
          node tests/goals.test.js
          node tests/observation-engine.test.js
          node tests/memory-navigation.test.js

      - name: Check app asset references
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const version = html.match(/DIGITAL ORGANISM · ([0-9.]+)/)?.[1];
          if (!version) throw new Error('Could not read the app version from index.html');
          for (const file of ['styles.css', 'activation.js', 'app.js', 'knowledge.js', 'goals.js', 'observation-engine.js', 'memory.js']) {
            if (!html.includes('./' + file + '?v=' + version)) {
              throw new Error('Missing or stale app reference for ' + version + ': ' + file);
            }
          }
          for (const id of ['memory-feed', 'knowledge-count', 'memory-manage', 'memory-library-back', 'memory-editor-back', 'memory-editor-input', 'memory-editor-preview', 'memory-editor-save', 'memory-editor-cancel', 'memory-export', 'memory-import', 'memory-import-file', 'memory-library', 'memory-library-list', 'memory-filter', 'memory-more', 'memory-clear']) {
            if (!html.includes('id="' + id + '"')) {
              throw new Error('Missing memory UI element: ' + id);
            }
          }
          console.log('App assets and memory UI references are valid.');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
