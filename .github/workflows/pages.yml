name: Validate and deploy NEUROGENESIS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neurogenesis-pages-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check canvas-quality.js
          node --check activation.js
          node --check neuron-layout.js
          node --check neuron-focus.js
          node --check app.js
          node --check knowledge.js
          node --check goals.js
          node --check observation-engine.js
          node --check knowledge-graph.js
          node --check reasoning-audit.js
          node --check discriminating-observations.js
          node --check hypothesis-lifecycle.js
          node --check dialog-context.js
          node --check dialog-manager.js
          node --check semantic-query.js
          node --check contextual-attention.js
          node --check phrase-composition.js
          node --check contextual-attention-ui.js
          node --check semantic-retrieval.js
          node --check llm-bridge.js
          node --check neuro-wasm-adapter.js
          node --check experience-quality.js
          node --check experience-benchmark.js
          node --check contrastive-benchmark.js
          node --check disposable-experiment-session.js
          node --check multi-hop-credit-diagnostic.js
          node --check multi-hop-credit-prototype.js
          node --check disposable-experiment-ui.js
          node --check compositional-benchmark.js
          node --check retention-scaling-benchmark.js
          node --check plasticity-headroom-benchmark.js
          node --check plasticity-efficiency-benchmark.js
          node --check plasticity-selective-cleanup-benchmark.js
          node --check plasticity-selective-cleanup-robustness.js
          node --check plasticity-three-route-stress-benchmark.js
          node --check plasticity-three-route-depth-benchmark.js
          node --check plasticity-three-route-profile-depth-benchmark.js
          node --check plasticity-four-route-depth-benchmark.js
          node --check plasticity-five-route-depth-benchmark.js
          node --check plasticity-five-route-order-isolation-benchmark.js
          node --check plasticity-five-route-composition-order-benchmark.js
          node --check plasticity-five-route-cleanup-budget-benchmark.js
          node --check memory.js
          node --check first-experiment.js
          node --input-type=module --check < server/llm-worker.js

      - name: Test collision-aware neuron layout
        run: node tests/neuron-layout.test.mjs

      - name: Test connectivity-based community layout
        run: node tests/neuron-community-layout.test.mjs

      - name: Test selected-neuron focus mode
        run: node tests/neuron-focus.test.mjs

      - name: Check app assets, DOM references and startup contracts
        run: |
          node tests/startup-contract.test.js
          node tests/first-experiment.test.js
          node tests/startup-failure.test.js
          node tests/wasm-shadow-mode.test.js

      - name: Check mobile layout, canvas lifecycle and visual quality
        run: |
          node tests/mobile-layout.test.js
          node tests/canvas-lifecycle.test.js
          node tests/canvas-quality.test.js

      - name: Check Worker deployment configuration
        run: node tests/worker-config.test.js

      - name: Build and test C++ core
        run: |
          cmake -S engine -B build/engine -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/engine --parallel 2
          ctest --test-dir build/engine --output-on-failure

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.1

      - name: Build WebAssembly module
        run: |
          emcmake cmake -S engine -B build/wasm -DCMAKE_BUILD_TYPE=Release -DNG_BUILD_WASM=ON -DBUILD_TESTING=OFF
          cmake --build build/wasm --parallel 2

      - name: Verify WebAssembly artifacts
        run: |
          test -s dist/neurogenesis.mjs
          test -s dist/neurogenesis.wasm
          ls -lh dist/neurogenesis.mjs dist/neurogenesis.wasm

      - name: Test WebAssembly adapter
        run: node tests/neuro-wasm-adapter.test.mjs

      - name: Test disposable WebAssembly experiments
        run: node tests/wasm-disposable-experiment.test.mjs

      - name: Test isolated contrastive trial session
        run: node tests/disposable-contrastive-trial.test.mjs

      - name: Test C++ and JavaScript numerical parity
        run: node tests/neuro-core-parity.test.mjs

      - name: Run experience benchmark
        run: node tests/experience-benchmark.test.mjs

      - name: Run contrastive benchmark
        run: node tests/contrastive-benchmark.test.mjs

      - name: Run multi-hop credit assignment diagnostic
        run: node tests/multi-hop-credit-diagnostic.test.mjs

      - name: Run path-aware multi-hop credit prototype
        run: node tests/multi-hop-credit-prototype.test.mjs

      - name: Run unequal-profile path-credit stress
        run: node tests/multi-hop-credit-unequal-profile.test.mjs

      - name: Upload multi-hop credit diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-multi-hop-credit-diagnostic-v1
          path: benchmark-reports/multi-hop-credit-diagnostic-v1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run compositional benchmark
        run: node tests/compositional-benchmark.test.mjs

      - name: Run retention and scaling benchmark
        run: node tests/retention-scaling-benchmark.test.mjs

      - name: Run plasticity headroom benchmark
        run: node tests/plasticity-headroom-benchmark.test.mjs

      - name: Upload plasticity headroom report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-plasticity-headroom-v4
          path: benchmark-reports/plasticity-headroom-v4.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run plasticity replay-efficiency benchmark
        run: node tests/plasticity-efficiency-benchmark.test.mjs

      - name: Upload plasticity efficiency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-plasticity-efficiency-v1
          path: benchmark-reports/plasticity-efficiency-v1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run selective plasticity cleanup benchmark
        run: node tests/plasticity-selective-cleanup-benchmark.test.mjs

      - name: Upload selective cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-plasticity-selective-cleanup-v1
          path: benchmark-reports/plasticity-selective-cleanup-v1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run selective cleanup robustness benchmark
        run: node tests/plasticity-selective-cleanup-robustness.test.mjs

      - name: Upload selective cleanup robustness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-plasticity-selective-cleanup-robustness-v1
          path: benchmark-reports/plasticity-selective-cleanup-robustness-v1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run three-route selective cleanup stress benchmark
        run: node tests/plasticity-three-route-stress-benchmark.test.mjs

      - name: Upload three-route stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-plasticity-three-route-stress-v1
          path: benchmark-reports/plasticity-three-route-stress-v1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run three-route cleanup depth benchmark
        run: node tests/plasticity-three-route-depth-benchmark.test.mjs

      - name: Upload three-route cleanup depth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-plasticity-three-route-depth-v2
          path: benchmark-reports/plasticity-three-route-depth-v2.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run three-route profile depth benchmark
        run: node tests/plasticity-three-route-profile-depth-benchmark.test.mjs

      - name: Upload three-route profile depth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-plasticity-three-route-profile-depth-v1
          path: benchmark-reports/plasticity-three-route-profile-depth-v1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload WebAssembly runtime
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-wasm
          path: |
            dist/neurogenesis.mjs
            dist/neurogenesis.wasm
          if-no-files-found: error

      - name: Test UD annotation importer and deterministic splits
        run: node tests/ud-russian-gsd-benchmark.test.js

      - name: Run independent language-understanding benchmark
        run: node tests/language-generalization.test.js

      - name: Download pinned UD Russian-GSD corpus
        run: |
          mkdir -p /tmp/ud-russian-gsd
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/9acc9d677327043bd416fcc89e4b3407c620d885/ru_gsd-ud-train.conllu \
            --output /tmp/ud-russian-gsd/ru_gsd-ud-train.conllu
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/9acc9d677327043bd416fcc89e4b3407c620d885/ru_gsd-ud-test.conllu \
            --output /tmp/ud-russian-gsd/ru_gsd-ud-test.conllu

      - name: Run external UD Russian-GSD language pilot
        run: |
          node tests/ud-russian-gsd-benchmark.test.js \
            /tmp/ud-russian-gsd/ru_gsd-ud-train.conllu \
            /tmp/ud-russian-gsd/ru_gsd-ud-test.conllu

      - name: Run regression tests
        run: |
          node tests/experience-quality.test.js
          node tests/activation.test.js
          node tests/knowledge.test.js
          node tests/memory-migration.test.js
          node tests/goals.test.js
          node tests/observation-engine.test.js
          node tests/knowledge-graph.test.js
          node tests/research-pipeline-integration.test.js
          node tests/reasoning-audit.test.js
          node tests/discriminating-observations.test.js
          node tests/hypothesis-lifecycle.test.js
          node tests/dialog-context.test.js
          node --check semantic-core.js
          node tests/semantic-query.test.js
          node tests/contextual-attention.test.js
          node tests/contextual-attention-retrieval-benchmark.test.js
          node tests/phrase-composition.test.js
          node tests/semantic-understanding.test.js
          node tests/proposition-chain-regression.test.js
          node tests/semantic-retrieval.test.js
          node tests/dialogue-llm-integration.test.js
          node tests/dialog-manager.test.js
          node tests/llm-config-setup.test.js
          node tests/llm-bridge.test.js
          node tests/llm-worker.test.js
          node tests/memory-navigation.test.js
          node tests/backup-import-transaction.test.js
          node tests/storage-transaction.test.js

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebAssembly runtime
        uses: actions/download-artifact@v4
        with:
          name: neurogenesis-wasm
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
