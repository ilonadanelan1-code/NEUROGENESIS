name: Evaluate ruBert-large on the matched 349-case Russian challenge set

on:
  push:
    branches:
      - experiment/wordfill-rubert-large-matched-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordfill-rubert-large-matched-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matched-rubert-large:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download pinned UD Russian-GSD
        run: |
          mkdir -p /tmp/ud-russian-gsd benchmark-inputs benchmark-reports
          curl --fail --location --retry 3 https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/9acc9d677327043bd416fcc89e4b3407c620d885/ru_gsd-ud-train.conllu --output /tmp/ud-russian-gsd/train.conllu
          curl --fail --location --retry 3 https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/9acc9d677327043bd416fcc89e4b3407c620d885/ru_gsd-ud-test.conllu --output /tmp/ud-russian-gsd/test.conllu

      - name: Rebuild deterministic matched benchmark input
        run: |
          node tests/ud-pretrained-mlm-benchmark.test.js \
            /tmp/ud-russian-gsd/train.conllu \
            /tmp/ud-russian-gsd/test.conllu \
            benchmark-inputs/ud-pretrained-mlm-input.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("benchmark-inputs/ud-pretrained-mlm-input.json").read_text())
          assert p["corpus"]["normalizedSampleTrainTestOverlaps"] == 0
          assert len(p["cases"]) >= 500
          print({"all_cases":len(p["cases"]),"sampled_train":p["corpus"]["sampledTrainSentences"],
                 "sampled_test":p["corpus"]["sampledTestSentences"],"overlap":0})
          PY

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir transformers==4.48.3

      - name: Validate matched ruBert-large runner
        run: |
          python -m py_compile scripts/pretrained_rubert_large_matched_wordfill.py
          test -s benchmark-inputs/ud-pretrained-mlm-input.json

      - name: Run matched ruBert-large word prediction
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_XET: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/pretrained_rubert_large_matched_wordfill.py \
            --input benchmark-inputs/ud-pretrained-mlm-input.json \
            --output benchmark-reports/ud-rubert-large-matched-wordfill-v1.json

      - name: Upload matched ruBert-large report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-rubert-large-matched-wordfill-v1
          path: benchmark-reports/ud-rubert-large-matched-wordfill-v1.json
          if-no-files-found: warn
          retention-days: 30
