name: Evaluate open Russian fill-word model candidates

on:
  push:
    branches:
      - experiment/wordfill-model-zoo-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordfill-model-zoo-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matched-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download pinned UD Russian-GSD
        run: |
          mkdir -p /tmp/ud-russian-gsd benchmark-inputs
          curl --fail --location --retry 3 https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/9acc9d677327043bd416fcc89e4b3407c620d885/ru_gsd-ud-train.conllu --output /tmp/ud-russian-gsd/train.conllu
          curl --fail --location --retry 3 https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/9acc9d677327043bd416fcc89e4b3407c620d885/ru_gsd-ud-test.conllu --output /tmp/ud-russian-gsd/test.conllu

      - name: Rebuild deterministic benchmark cases
        run: |
          node --check contextual-attention.js
          node --check scripts/ud-russian-gsd.js
          node tests/ud-pretrained-mlm-benchmark.test.js \
            /tmp/ud-russian-gsd/train.conllu \
            /tmp/ud-russian-gsd/test.conllu \
            benchmark-inputs/ud-pretrained-mlm-input.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("benchmark-inputs/ud-pretrained-mlm-input.json").read_text())
          assert len(data["cases"]) >= 500
          assert data["corpus"]["normalizedSampleTrainTestOverlaps"] == 0
          print({"targets":len(data["cases"]),"train_test_overlap":data["corpus"]["normalizedSampleTrainTestOverlaps"]})
          PY

      - name: Upload matched input
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-wordfill-model-zoo-input-v1
          path: benchmark-inputs/ud-pretrained-mlm-input.json
          retention-days: 30

  rubert-large:
    needs: prepare-matched-sample
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir transformers==4.48.3

      - name: Download matched input
        uses: actions/download-artifact@v4
        with:
          name: neurogenesis-wordfill-model-zoo-input-v1
          path: benchmark-inputs

      - name: Validate ruBert-large runner
        run: |
          python -m py_compile scripts/pretrained_rubert_large_wordfill.py
          test -s benchmark-inputs/ud-pretrained-mlm-input.json

      - name: Run matched ruBert-large whole-word benchmark
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_XET: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/pretrained_rubert_large_wordfill.py \
            --input benchmark-inputs/ud-pretrained-mlm-input.json \
            --output benchmark-reports/ud-rubert-large-wordfill-v1.json

      - name: Upload ruBert-large report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-rubert-large-wordfill-v1
          path: benchmark-reports/ud-rubert-large-wordfill-v1.json
          if-no-files-found: warn
          retention-days: 30

  fred-t5-large:
    needs: prepare-matched-sample
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir transformers==4.48.3

      - name: Download matched input
        uses: actions/download-artifact@v4
        with:
          name: neurogenesis-wordfill-model-zoo-input-v1
          path: benchmark-inputs

      - name: Validate FRED-T5 runner
        run: |
          python -m py_compile scripts/pretrained_fred_t5_large_wordfill.py
          test -s benchmark-inputs/ud-pretrained-mlm-input.json

      - name: Run matched FRED-T5-large span-infilling benchmark
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_XET: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/pretrained_fred_t5_large_wordfill.py \
            --input benchmark-inputs/ud-pretrained-mlm-input.json \
            --output benchmark-reports/ud-fred-t5-large-wordfill-v1.json

      - name: Upload FRED-T5 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-fred-t5-large-wordfill-v1
          path: benchmark-reports/ud-fred-t5-large-wordfill-v1.json
          if-no-files-found: warn
          retention-days: 30
