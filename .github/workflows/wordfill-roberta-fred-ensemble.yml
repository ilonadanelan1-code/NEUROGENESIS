name: Evaluate ruRoBERTa plus FRED-T5 RRF and PLL ensemble

on:
  push:
    branches:
      - experiment/wordfill-roberta-fred-rrf-pll-ensemble-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wordfill-roberta-fred-ensemble-v1
  cancel-in-progress: true

jobs:
  merge-and-rerank:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout ensemble experiment
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download immutable matched benchmark input
        uses: actions/download-artifact@v4
        with:
          name: neurogenesis-wordfill-pll-input-v1
          repository: ilonadanelan1-code/NEUROGENESIS
          run-id: 43766804971
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmark-inputs/sample

      - name: Download ruRoBERTa PLL candidate report
        uses: actions/download-artifact@v4
        with:
          name: neurogenesis-roberta-pll-reranker-v1
          repository: ilonadanelan1-code/NEUROGENESIS
          run-id: 43766804971
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmark-inputs/roberta

      - name: Validate fixed benchmark inputs and merger
        run: |
          test -s benchmark-inputs/sample/ud-pretrained-mlm-input.json
          test -s benchmark-inputs/roberta/ud-roberta-pll-reranked-v1.json
          python -m py_compile scripts/merge_wordfill_candidate_pools.py
          python -m py_compile scripts/pretrained_fred_t5_large_matched_wordfill.py
          python -m py_compile scripts/rerank_word_candidates_by_pseudolikelihood.py
          python tests/wordfill_ensemble_merge_test.py

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir transformers==4.52.4 sentencepiece protobuf

      - name: Run FRED-T5-large on the same immutable matched input
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_XET: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          mkdir -p benchmark-inputs/fred
          python scripts/pretrained_fred_t5_large_matched_wordfill.py \
            --input benchmark-inputs/sample/ud-pretrained-mlm-input.json \
            --output benchmark-inputs/fred/ud-fred-t5-large-matched-wordfill-v1.json

      - name: Merge RoBERTa Top-32 and FRED Top-8 using fixed RRF
        run: |
          python scripts/merge_wordfill_candidate_pools.py \
            --roberta-report benchmark-inputs/roberta/ud-roberta-pll-reranked-v1.json \
            --fred-report benchmark-inputs/fred/ud-fred-t5-large-matched-wordfill-v1.json \
            --rrf-k 60 \
            --expected-targets 349 \
            --output benchmark-inputs/ud-roberta-fred-rrf-candidate-pool-v1.json

      - name: Score every union candidate with ruRoBERTa PLL
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_XET: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/rerank_word_candidates_by_pseudolikelihood.py \
            --input benchmark-inputs/sample/ud-pretrained-mlm-input.json \
            --candidates benchmark-inputs/ud-roberta-fred-rrf-candidate-pool-v1.json \
            --output benchmark-reports/ud-roberta-fred-rrf-pll-ensemble-v1.json

      - name: Upload candidate pool and ensemble report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-roberta-fred-rrf-pll-ensemble-v1
          path: |
            benchmark-inputs/ud-roberta-fred-rrf-candidate-pool-v1.json
            benchmark-reports/ud-roberta-fred-rrf-pll-ensemble-v1.json
          if-no-files-found: warn
          retention-days: 30
