name: Validate NEUROGENESIS overnight branch

on:
  push:
    branches:
      - automation/overnight-neurogenesis-20261109

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check activation.js
          node --check app.js
          node --check knowledge.js
          node --check goals.js
          node --check observation-engine.js
          node --check knowledge-graph.js
          node --check reasoning-audit.js
          node --check discriminating-observations.js
          node --check hypothesis-lifecycle.js
          node --check dialog-context.js
          node --check dialog-manager.js
          node --check llm-bridge.js
          node --input-type=module --check < server/llm-worker.js
          node --check memory.js
      - name: Check app asset references
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const version = html.match(/DIGITAL ORGANISM · ([0-9.]+)/)?.[1];
          if (!version) throw new Error('Could not read the app version from index.html');
          for (const file of ['styles.css', 'activation.js', 'app.js', 'knowledge.js', 'goals.js', 'observation-engine.js', 'knowledge-graph.js', 'reasoning-audit.js', 'discriminating-observations.js', 'hypothesis-lifecycle.js', 'dialog-context.js', 'dialog-manager.js', 'llm-bridge.js', 'memory.js']) {
            if (!html.includes('./' + file + '?v=' + version)) {
              throw new Error('Missing or stale app reference for ' + version + ': ' + file);
            }
          }
          for (const id of ['memory-feed', 'knowledge-count', 'memory-manage', 'memory-library-back', 'memory-editor-back', 'memory-editor-input', 'memory-editor-preview', 'memory-editor-save', 'memory-editor-cancel', 'memory-export', 'memory-import', 'memory-import-file', 'memory-library', 'memory-library-list', 'memory-filter', 'memory-more', 'memory-clear', 'llm-ask-button', 'llm-settings', 'llm-connection-status', 'llm-endpoint', 'llm-client-token', 'llm-save-config', 'llm-clear-config', 'memory-input', 'remember-button', 'ask-button']) {
            if (!html.includes('id="' + id + '"')) {
              throw new Error('Missing memory UI element: ' + id);
            }
          }
          console.log('App assets and memory UI references are valid.');
          NODE

      - name: Build and test C++ core
        run: |
          cmake -S engine -B build/engine -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/engine --parallel 2
          ctest --test-dir build/engine --output-on-failure

      - name: Check mobile layout contracts
        run: node tests/mobile-layout.test.js

      - name: Check canvas lifecycle contracts
        run: node tests/canvas-lifecycle.test.js

      - name: Run regression tests
        run: |
          node tests/activation.test.js
          node tests/knowledge.test.js
          node tests/memory-migration.test.js
          node tests/goals.test.js
          node tests/observation-engine.test.js
          node tests/knowledge-graph.test.js
          node tests/reasoning-audit.test.js
          node tests/discriminating-observations.test.js
          node tests/hypothesis-lifecycle.test.js
          node tests/dialog-context.test.js
          node tests/dialogue-llm-integration.test.js
          node tests/dialog-manager.test.js
          node tests/llm-bridge.test.js
          node tests/llm-worker.test.js
          node tests/memory-navigation.test.js
          node tests/backup-import-transaction.test.js
          node tests/storage-transaction.test.js
