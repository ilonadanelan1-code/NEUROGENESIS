name: Deploy NEUROGENESIS Worker

on:
  push:
    branches:
      - main
    paths:
      - "server/llm-worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify public workers.dev endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 \
            "https://neurogenesis-llm-proxy.ilonadanelan1.workers.dev/")"
          node -e '
            let data;
            try { data = JSON.parse(process.argv[1]); }
            catch { throw new Error("Worker root endpoint did not return valid JSON"); }
            if (data.ok !== true || data.service !== "NEUROGENESIS LLM proxy") {
              throw new Error("Unexpected Worker health payload: " + JSON.stringify(data));
            }
            console.log("Public Worker DNS and HTTP endpoint are reachable.");
          ' "$response"
          headers="$(curl --silent --show-error --dump-header - --output /dev/null \\
            --request OPTIONS --max-time 20 \\
            --header "Origin: https://ilonadanelan1-code.github.io" \\
            --header "Access-Control-Request-Method: GET" \\
            --header "Access-Control-Request-Headers: authorization" \\
            "https://neurogenesis-llm-proxy.ilonadanelan1.workers.dev/api/health")"
          printf '%s\\n' "$headers" | grep -Fqi "access-control-allow-origin: https://ilonadanelan1-code.github.io"
          printf '%s\\n' "$headers" | grep -Fqi "access-control-allow-headers: Authorization, Content-Type"
          echo "Worker CORS preflight accepts the published GitHub Pages origin."
