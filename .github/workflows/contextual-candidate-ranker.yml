name: Validate contextual OOV candidate ranker

on:
  push:
    branches:
      - experiment/contextual-candidate-ranker-v1
  pull_request:
    branches:
      - main
    paths:
      - contextual-candidate-ranker.js
      - contextual-attention-ui.js
      - index.html
      - tests/contextual-candidate-ranker.test.js
      - tests/ud-context-candidate-ranker.test.js
      - tests/ud-context-ranker-holdout-benchmark.test.js
      - tests/ud-context-ranker-retrieval-tuning.test.js
      - tests/ud-lemma-surface-benchmark.test.js
      - scripts/ud-russian-gsd.js
      - ud-context-candidate-ranker.js
      - .github/workflows/contextual-candidate-ranker.yml

permissions:
  contents: read

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check contextual-candidate-ranker.js
          node --check contextual-attention-ui.js
      - name: Test masked-context candidate ranking
        run: node tests/contextual-candidate-ranker.test.js

      - name: Check UD candidate ranker syntax
        run: node --check ud-context-candidate-ranker.js
      - name: Test UD candidate ranker fixtures
        run: node tests/ud-context-candidate-ranker.test.js
      - name: Download pinned UD Russian-GSD corpus
        run: |
          mkdir -p /tmp/ud-russian-gsd
          curl --fail --location --retry 3 https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/9acc9d677327043bd416fcc89e4b3407c620d885/ru_gsd-ud-train.conllu --output /tmp/ud-russian-gsd/train.conllu
          curl --fail --location --retry 3 https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/9acc9d677327043bd416fcc89e4b3407c620d885/ru_gsd-ud-dev.conllu --output /tmp/ud-russian-gsd/dev.conllu
      - name: Tune context retrieval settings on UD dev only
        run: node tests/ud-context-ranker-retrieval-tuning.test.js /tmp/ud-russian-gsd/train.conllu /tmp/ud-russian-gsd/dev.conllu
      - name: Upload dev-only context retrieval tuning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-ud-context-ranker-retrieval-tuning-v1
          path: benchmark-reports/ud-context-ranker-retrieval-tuning-v1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Benchmark lemma-first surface reconstruction on UD dev
        run: node tests/ud-lemma-surface-benchmark.test.js /tmp/ud-russian-gsd/train.conllu /tmp/ud-russian-gsd/dev.conllu
      - name: Upload lemma and surface reconstruction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-ud-lemma-surface-v1
          path: benchmark-reports/ud-lemma-surface-v1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Check script loading order
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const ranker = html.indexOf('contextual-candidate-ranker.js');
          const ui = html.indexOf('contextual-attention-ui.js');
          if (ranker < 0 || ui < 0 || ranker > ui) {
            throw new Error('Candidate ranker must load after the model and before its UI.');
          }
          console.log('Candidate ranker script is loaded before the contextual UI.');
          NODE
