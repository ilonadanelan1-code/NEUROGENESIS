<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEUROGENESIS · проверка локальной модели</title>
  <style>
    body{font:15px/1.45 system-ui,sans-serif;margin:0;padding:14px;background:#0b0f14;color:#dbe6f0;max-width:760px}
    h1{font-size:17px;margin:0 0 10px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
    button{font:inherit;padding:9px 14px;border:1px solid #2c4a63;border-radius:8px;background:#12263a;color:#dbe6f0}
    button:disabled{opacity:.45}
    select,textarea{font:inherit;background:#0f1a26;color:#dbe6f0;border:1px solid #2c4a63;border-radius:8px;padding:8px}
    textarea{width:100%;box-sizing:border-box;min-height:70px}
    progress{width:100%;height:14px}
    #state{white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;background:#0f1a26;border-radius:8px;padding:8px}
    #out{white-space:pre-wrap;min-height:90px;background:#0f1a26;border-radius:8px;padding:10px}
    #meta{white-space:pre-wrap;font-size:13px;line-height:1.5;margin:8px 0}
    #diagnostics{white-space:pre-wrap;font-size:12px;line-height:1.45;margin:8px 0;background:#0f1a26;border-radius:8px;padding:9px;overflow-wrap:anywhere}
    #err{color:#ff9b9b;white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>Локальная модель · Qwen3-0.6B (изолированный тест)</h1>
  <div class="row">
    <select id="device" title="Вычислительный режим">
      <option value="auto">Авто (WebGPU → CPU)</option>
      <option value="webgpu">Только WebGPU</option>
      <option value="wasm">Только CPU (WASM)</option>
    </select>
    <button id="load">Загрузить модель</button>
    <button id="cache">Проверить кэш</button>
  </div>
  <div class="row">
    <select id="generationMode" title="Режим генерации">
      <option value="stable">Стабильный · без случайности</option>
      <option value="sampling">Эксперимент · temperature 0.7</option>
    </select>
    <button id="reset">Новый диалог</button>
  </div>
  <progress id="bar" max="100" value="0"></progress>
  <div id="progressText">Модель не загружена. Первая загрузка скачивает сотни мегабайт.</div>
  <div id="state">состояние: —</div>
  <textarea id="input" placeholder="Напиши сообщение на русском…">Объясни простыми словами, чем нейрон мозга отличается от узла нейросети.</textarea>
  <div class="row">
    <button id="send" disabled>Отправить</button>
    <button id="stop" disabled>Остановить</button>
  </div>
  <div id="out"></div>
  <div id="meta"></div>
  <div id="diagnostics">Диагностика GPU появится после загрузки модели.</div>
  <div id="err"></div>

  <script src="../local-llm-adapter.js"></script>
  <script>
    "use strict";
    const $ = id => document.getElementById(id);
    let runtimeDiagnostics = null;
    let lastGpuProfile = null;
    const adapter = NGLocalLLM.create({
      workerUrl: "../local-llm-worker.js",
      onStatus: renderStatus,
      onDiagnostics: diagnostics => { runtimeDiagnostics = diagnostics; renderDiagnostics(); },
      onProfile: profile => { lastGpuProfile = profile; renderDiagnostics(); }
    });
    const systemPrompt = "Ты NEUROGENESIS, локальный помощник. Отвечай естественным и грамматически правильным русским языком. Сначала дай прямой ответ. На простой вопрос достаточно 1–3 коротких предложений. Не выдумывай детали. Если не знаешь, так и скажи. Не повторяй вопрос.";
    let history = [{ role: "system", content: systemPrompt }];
    let busy = false;

    function showError(error) {
      if (!error) { $("err").textContent = ""; return; }
      let message = "Ошибка [" + (error.code || "error") + "]: " + (error.message || error);
      const details = error.details;
      if (details) {
        if (details.stage) message += "\nЭтап: " + details.stage;
        if (details.originalName || details.originalMessage) {
          message += "\nИсходная ошибка: " + [details.originalName, details.originalMessage].filter(Boolean).join(": ");
        }
        if (details.stack) message += "\nСтек:\n" + details.stack;
        else message += "\nДетали: " + JSON.stringify(details);
      }
      $("err").textContent = message;
    }
    function renderStatus(status) {
      const s = status || adapter.status();
      $("state").textContent =
        "фаза: " + s.phase + "\nмодель: " + (s.modelId || "—") + "\nревизия: " + (s.revision || "—") +
        "\nрежим: " + (s.device || "—") + " / " + (s.dtype || "—") + (s.fellBack ? " (резервный)" : "") +
        "\nпостоянное хранилище: " + (s.persisted === true ? "да" : s.persisted === false ? "нет" : "неизвестно") +
        "\nрантайм: " + (s.runtimeUrl || "—");
      const ready = s.phase === "ready";
      $("send").disabled = !ready || busy;
      $("load").disabled = s.phase === "loading" || ready || s.phase === "generating";
    }
    function formatBytes(value) { return (value / 1048576).toFixed(1) + " МБ"; }
    function formatMs(value) {
      if (!Number.isFinite(value)) return "—";
      return value < 1000 ? Math.round(value) + " мс" : (value / 1000).toFixed(1) + " с";
    }
    function formatRate(value) { return Number.isFinite(value) ? value.toFixed(2) : "—"; }
    function yesNo(value) { return value === true ? "да" : value === false ? "нет" : "неизвестно"; }
    function adapterName(info) {
      if (!info) return "сведения недоступны";
      return [info.vendor, info.architecture, info.device].filter(Boolean).join(" / ") || "название скрыто браузером";
    }
    function renderDiagnostics() {
      const d = runtimeDiagnostics;
      if (!d) {
        $("diagnostics").textContent = "Диагностика GPU появится после загрузки модели.";
        return;
      }
      const probe = d.probe || {};
      const actual = d.runtimeGpu || {};
      const features = actual.features || probe;
      const p = lastGpuProfile;
      const lines = [
        "Transformers.js: " + (d.transformersVersion || "—") + " · ONNX Runtime Web: " + (d.onnxRuntimeWebVersion || "—"),
        "GPU-адаптер: " + adapterName(actual.adapter || probe.adapter),
        "shader-f16: " + yesNo(features.shaderF16) + " · timestamp-query: " + yesNo(features.timestampQuery) +
          " · экспериментальные timestamp: " + yesNo(features.experimentalTimestampQuery) + " · subgroups: " + yesNo(features.subgroups),
        "Профилировщик GPU: " + (d.profiler && d.profiler.configured ? "включён" : "не удалось включить") +
          (d.profiler && d.profiler.error ? " · " + d.profiler.error : ""),
        "WASM: потоков=" + (d.wasm && d.wasm.numThreads != null ? d.wasm.numThreads : "—") +
          " · proxy=" + yesNo(d.wasm && d.wasm.proxy),
        p ? "GPU-операции: " + p.eventCount + " · сумма времени GPU-ядер: " + Number(p.totalGpuMs || 0).toFixed(2) + " мс" :
          "GPU-операции: ожидаю первый запуск генерации"
      ];
      if (p && p.kernels && p.kernels.length) {
        lines.push("Самые затратные GPU-ядра:");
        for (const item of p.kernels.slice(0, 6)) {
          lines.push("  " + item.name + " · " + item.count + " выз. · " + Number(item.gpuMs || 0).toFixed(2) + " мс");
        }
      } else if (d.profiler && !d.profiler.timestampQueryAvailable) {
        lines.push("GPU-времена недоступны: адаптер не сообщил поддержку timestamp-query.");
      }
      if (d.nodeAssignmentWarning) {
        lines.push("ORT предупредил: часть узлов не назначена предпочтительному провайдеру. Это не доказывает проблему само по себе — служебные операции могут штатно исполняться на CPU.");
      }
      if (d.assignmentLogs && d.assignmentLogs.length) {
        lines.push("Выдержки из журнала распределения узлов:");
        for (const line of d.assignmentLogs.slice(0, 5)) lines.push("  " + line);
      } else {
        lines.push("Распределение узлов: подробных строк ORT пока не получено.");
      }
      lines.push("Важно: сумма GPU-ядер — не всё время ответа и не доля GPU в процентах.");
      $("diagnostics").textContent = lines.join("\n");
    }

    $("reset").onclick = () => {
      if (busy) return;
      history = [{ role: "system", content: systemPrompt }];
      $("out").textContent = "";
      $("meta").textContent = "";
      showError(null);
    };

    $("load").onclick = async () => {
      showError(null);
      $("load").disabled = true;
      try {
        const result = await adapter.load({ device: $("device").value }, event => {
          if (event.phase === "download") {
            $("bar").value = event.percent;
            $("progressText").textContent = "Загрузка: " + event.percent + "% (" + formatBytes(event.loaded) + " из " + formatBytes(event.total) + ")";
          } else if (event.message) $("progressText").textContent = event.message;
        });
        $("bar").value = 100;
        const cache = result.cache;
        $("progressText").textContent = "Готово. Файлов в кэше: " + (cache ? cache.files.filter(f => f.status === "ok").length + "/" + cache.files.length : "?") +
          (result.metaSource === "stored" ? " · сведения о модели взяты из сохранённых (офлайн)" : "");
        renderStatus(adapter.status());
      } catch (error) { showError(error); renderStatus(adapter.status()); }
    };
    $("cache").onclick = async () => {
      showError(null);
      try {
        const report = await adapter.checkCache({ device: $("device").value });
        $("progressText").textContent = "Кэш (" + report.dtype + "): " + (report.complete ? "полный" : "не полный") +
          " · отсутствует: " + report.missing.length + " · повреждено: " + report.corrupt.length;
      } catch (error) { showError(error); }
    };
    $("send").onclick = async () => {
      const text = $("input").value.trim();
      if (!text || busy) return;
      showError(null);
      busy = true; $("send").disabled = true; $("stop").disabled = false;
      $("out").textContent = ""; $("meta").textContent = "";
      const turn = history.concat([{ role: "user", content: text }]);
      try {
        const generation = $("generationMode").value === "sampling"
          ? { max_new_tokens: 128, temperature: 0.7, top_p: 0.8, top_k: 20, repetition_penalty: 1.05 }
          : { max_new_tokens: 128, temperature: 0, repetition_penalty: 1.05 };
        const result = await adapter.generateDetailed(
          { schema: "NEUROGENESIS_LLM_REQUEST_V1", messages: turn },
          { generation, onToken: piece => { $("out").textContent += piece; } }
        );
        history = turn.concat([{ role: "assistant", content: result.reply }]);
        if (result.gpuProfile) lastGpuProfile = result.gpuProfile;
        renderDiagnostics();
        const u = result.usage || {};
        const m = result.metrics || {};
        $("meta").textContent = [
          (result.stopped ? "Остановлено пользователем. " : "") +
            "Токенов: " + (u.completion_tokens || 0) + " · режим: " + $("generationMode").selectedOptions[0].textContent,
          "До первого токена: " + formatMs(m.timeToFirstTokenMs) + " · до первого текста: " + formatMs(m.timeToFirstTextMs),
          "Подготовка запроса: " + formatMs(m.promptPreparationMs) + " · генерация: " + formatMs(m.generationMs) + " · всего: " + formatMs(m.totalMs),
          "Скорость после первого токена: " + formatRate(m.decodeTokensPerSecond) + " ток/с · вместе с ожиданием: " + formatRate(m.endToEndTokensPerSecond || result.tokensPerSecond) + " ток/с",
          "Устройство: " + result.device + "/" + result.dtype
        ].join("\n");
      } catch (error) { showError(error); }
      busy = false; $("stop").disabled = true; renderStatus(adapter.status());
    };
    $("stop").onclick = () => adapter.stop();
    renderStatus(adapter.status());
  </script>
</body>
</html>
